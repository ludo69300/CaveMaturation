<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <title>Calculateur salaison</title>
        <script src="scriptsalaison.js" defer></script>
        <link href="style.css" rel="stylesheet" />
        <link rel="icon" href="images/favicon.ico" />
    </head>
    <body>
         <header>
            <h1>Cave de maturation</h1>
            <a href="index.html">Retour</a>
            <a href="fumage.html">temp séchage et fumage</a>
        </header>
        <nav class="conteneur">
            <div class="button">
            <a href="index.html">home</a>
            </div>
            <div class="button">
            <a href="fumage.html">séchage fumage</a>
            </div>
        </nav>
        <main>
            <form action="" method="post">
                <div class="box">
                    <label for="type sal">type ou produit</label>
                    <div class="box">
                        <select id="typesalaison" name="typeMateriau" onchange="fcntypeSalaison()" class="field large required valid"
                            aria-invalid="false">
                            <option value="0" >SALAISON SOUS VIDE</option>
                            <option value="1" >SAUMURE LEGERE</option>
                            <option value="2" >CÔTE DE BOEUF</option>
                            <option value="3">FOIE GRAS</option>
                            <option value="4" >SAUMON FUMÉ</option>
                            <option value="5">PÂTE À PIZZA</option>
                            <option value="6">PÂTE À BUNS</option>
                        </select>
                    </div>
                </div>
                <fieldset style="overflow:auto;display:inline-block">
                    <legend><h2 id="salaison">Salaison sous vide</h2></legend> <!-- Titre du fieldset -->
                    <div class="box">
                        <label for="salaisonHauteur">Hauteur viande (en Cm)</label>
                        <div class="box">
                            <input inputmode="decimal" id="salaisonHauteur" name="salaisonHauteur" min="1" max="20" step="1"class="field digits large required" type="number" value="4">
                        </div>
                    </div>
                    <div class="box">
                        <label for="salaisonJour">Nombre de jour</label>
                        <div class="box">
                            <input id="salaisonJour" name="salaisonJour" readonly="readonly"
                            class="codepeoplecalculatedfield field large valid" type="text" value="3 j">
                        </div>
                    </div>
                    <div class="box">
                        <label for="salaisonPoids">Poids viande (en grammes)</label>
                        <div class="box">
                            <input inputmode="decimal" id="salaisonPoids" name="salaisonPoids" min="100" max="20000" step="1"
                            class="field digits large required" type="number" value="1000">
                        </div>
                    </div>
                    <div class="box">
                            <label for="salaisonSelect">% de sel fin (4,5% recommandé)</label>
                            <div class="box">
                            <select id="salaisonSelect" name="salaisonSelect" class="field large required valid"
                                aria-invalid="false">
                                <option value="0.03">3.00%</option>
                                <option value="0.035">3.50%</option>
                                <option value="0.04">4.00%</option>
                                <option selected="selected" value="0.045">4.50%</option>
                                <option value="0.05">5.00%</option>
                                <option value="0.055">5.50%</option>
                                <option value="0.06">6.00%</option>
                            </select>
                        </div>
                    </div>
                    <div class="box">
                        <label for="salaisonSel">Sel fin (ou sel nitré)</label>
                        <div class="box">
                            <input id="salaisonSel" name="salaisonSel" readonly="readonly"
                            class="codepeoplecalculatedfield field large valid" type="text" value="45 gr">
                        </div>
                    </div>
                    <div class="box">
                        <label for="salaisonSucre">Sucre roux</label>
                        <div class="box">
                            <input id="salaisonSucre" name="salaisonSucre" readonly="readonly"
                            class="codepeoplecalculatedfield field large valid" type="text" value="22.50 gr">
                        </div>
                    </div>
                    <div class="box">
                        <label for="salaisonPoivre">Poivre moulu</label>
                        <div class="box">
                            <input id="salaisonPoivre" name="salaisonPoivre" readonly="readonly"
                            class="codepeoplecalculatedfield field large valid" type="text" value="1 gr">
                        </div>
                    </div>
                    <div class="box">
                        <label for="salaisonBaie">Baie de Genièvre</label>
                        <div class="box">
                            <input id="salaisonBaie" name="salaisonBaie" readonly="readonly"
                            class="codepeoplecalculatedfield field large valid" type="text" value="1 gr">
                        </div>
                    </div>
                    <div class="box">
                        <label for="salaisonEpices">4 épices</label>
                        <div class="box">
                            <input id="salaisonEpices" name="salaisonEpices" readonly="readonly"
                            class="codepeoplecalculatedfield field large valid" type="text" value="0.50 gr">
                        </div>
                    </div>
                    <div class="box">
                        <label for="salaisonLaurier">Laurier </label>
                        <div class="box">
                            <input id="salaisonLaurier" name="salaisonLaurier" readonly="readonly"
                            class="codepeoplecalculatedfield field large valid" type="text" value="2.0 Feuilles">
                        </div>
                    </div>
                </fieldset>
                <fieldset style="overflow:auto;display:none">
                    <legend><h2 id="saumure">Saumure légère</h2></legend> <!-- Titre du fieldset -->
                    <h3>Pour le Pastrami de Dinde ou le Poulet fumé</h3>
                    <div class="box">
                        <label for="saumureeau">Volume d'eau en Litre</label>
                        <div class="box">
                            <input inputmode="decimal" id="saumureeau" name="saumureeau" min="1" max="100" step="1"
                            class="field digits large required" type="number" value="1">
                        </div>
                    </div>
                    <div class="box">
                        <label for="saumureSel">Sel fin</label>
                        <div class="box">
                            <input id="saumureSel" name="saumureSel" readonly="readonly"
                            class="codepeoplecalculatedfield field large valid" type="text" value="60 gr">
                        </div>
                    </div>
                    <div class="box">
                        <label for="saumureSucre">Sucre roux</label>
                        <div class="box">
                            <input id="saumureSucre" name="saumureSucre" readonly="readonly"
                            class="codepeoplecalculatedfield field large valid" type="text" value="30 gr">
                        </div>
                    </div>
                    <div class="box">
                        <label for="saumurePoivre">Poivre en grain</label>
                        <div class="box">
                            <input id="saumurePoivre" name="saumurePoivre" readonly="readonly"
                            class="codepeoplecalculatedfield field large valid" type="text" value="5 gr">
                        </div>
                    </div>
                    <div class="box">
                        <label for="saumureBaie">Baie de Genièvre</label>
                        <div class="box">
                            <input id="saumureBaie" name="saumureBaie" readonly="readonly"
                            class="codepeoplecalculatedfield field large valid" type="text" value="10 gr">
                        </div>
                    </div>
                    <div class="box">
                        <label for="saumureSauge">Sauge</label>
                        <div class="box">
                            <input id="saumureSauge" name="saumureSauge" readonly="readonly"
                            class="codepeoplecalculatedfield field large valid" type="text" value="2 gr">
                        </div>
                    </div>
                    <div class="box">
                        <label for="saumureThym">Thym</label>
                        <div class="box">
                            <input id="saumureThym" name="saumureThym" readonly="readonly"
                            class="codepeoplecalculatedfield field large valid" type="text" value="1 branche(s)">
                        </div>
                    </div>
                    <div class="box">
                        <label for="saumureClou">Clou de Girofle</label>
                        <div class="box">
                            <input id="saumureClou" name="saumureClou" readonly="readonly"
                            class="codepeoplecalculatedfield field large valid" type="text" value="1 clou(s)">
                        </div>
                    </div>
                    <div class="box">
                        <label for="saumureLaurier">Laurier</label>
                        <div class="box">
                            <input id="saumureLaurier" name="saumureLaurier" readonly="readonly"
                            class="codepeoplecalculatedfield field large valid" type="text" value="2.0 Feuilles">
                        </div>
                    </div>
                </fieldset>
                <fieldset style="overflow:auto;display:none">
                    <legend><h2 id="cote">Côte de boeuf</h2></legend> <!-- Titre du fieldset -->
                    <div class="box">
                        <label for="cotePoids">Poids de la côte de boeuf  (en grammes)</label>
                        <div class="box">
                            <input inputmode="decimal" id="cotePoids" name="cotePoids" min="100" max="20000" step="1"
                            class="field digits large required" type="number" value="1000">
                        </div>
                    </div>
                    <div class="box">
                        <label for="coteSel">Sel</label>
                        <div class="box">
                            <input id="coteSel" name="coteSel" readonly="readonly"
                            class="codepeoplecalculatedfield field large valid" type="text" value="45 gr">
                        </div>
                    </div>
                </fieldset>
                <fieldset style="overflow:auto;display:none">
                    <legend><h2 id="foie">Foie Gras</h2></legend> <!-- Titre du fieldset -->
                    <div class="box">
                        <label for="foiePoids">Poids foie gras (en grammes)</label>
                        <div class="box">
                            <input inputmode="decimal" id="foiePoids" name="foiePoids" min="100" max="20000" step="1"
                            class="field digits large required" type="number" value="1000">
                        </div>
                    </div>
                    <div class="box">
                        <label for="foieSel">Sel fin</label>
                        <div class="box">
                            <input id="foieSel" name="foieSel" readonly="readonly"
                            class="codepeoplecalculatedfield field large valid" type="text" value="45 gr">
                        </div>
                    </div>
                    <div class="box">
                        <label for="foieSucre">Sucre</label>
                        <div class="box">
                            <input id="foieSucre" name="foieSucre" readonly="readonly"
                            class="codepeoplecalculatedfield field large valid" type="text" value="6 gr">
                        </div>
                    </div>
                    <div class="box">
                        <label for="foiePoivre">Poivre</label>
                        <div class="box">
                            <input id="foiePoivre" name="foiePoivre" readonly="readonly"
                            class="codepeoplecalculatedfield field large valid" type="text" value="2 gr">
                        </div>
                    </div>
                    <div class="box">
                        <label for="foieEpices">4 épices</label>
                        <div class="box">
                            <input id="foieEpices" name="foieEpices" readonly="readonly"
                            class="codepeoplecalculatedfield field large valid" type="text" value="1 gr">
                        </div>
                    </div>
                    <div class="box">
                        <label for="foieLiquoreux">Liquoreux</label>
                        <div class="box">   
                            <input id="foieLiquoreux" name="foieLiquoreux" readonly="readonly"
                            class="codepeoplecalculatedfield field large valid" type="text" value="20 gr">
                        </div>
                    </div>
                </fieldset>
                <fieldset style="overflow:auto;display:none">
                    <legend><h2 id="saumon">Salage sous-vide Saumon fumé </h2></legend> <!-- Titre du fieldset -->
                    <div class="box">
                        <label for="saumonPoids">Poids de la truite ou saumon (en grammes)</label>
                        <div class="box">
                            <input inputmode="decimal" id="saumonPoids" name="saumonPoids" min="100" max="20000" step="1"
                            class="field digits large required" type="number" value="1000">
                        </div>
                    </div>
                    <div class="box">
                        <label for="saumonSel">Gros sel de Guérande moulu ou sel fin</label>
                        <div class="box">
                            <input id="saumonSel" name="saumonSel" readonly="readonly"
                            class="codepeoplecalculatedfield field large valid" type="text" value="34 gr">
                        </div>
                    </div>
                    <div class="box">
                        <label for="saumonSucre">Sucre</label>
                        <div class="box">
                            <input id="saumonSucre" name="saumonSucre" readonly="readonly"
                            class="codepeoplecalculatedfield field large valid" type="text" value="17 gr">
                        </div>
                    </div>
                    <div class="box">
                        <label for="saumonBaie">Baie de Genièvre</label>
                        <div class="box">
                            <input id="saumonBaie" name="saumonBaie" readonly="readonly"
                            class="codepeoplecalculatedfield field large valid" type="text" value="1 gr">
                        </div>
                    </div>
                </fieldset>
                <fieldset style="overflow:auto;display:none">
                    <legend><h2 id="pizza">Pâte à pizza</h2></legend> <!-- Titre du fieldset -->
                    <div class="box">
                        <label for="pizzaPoids">Poids de la pâte (en grammes)</label>
                        <div class="box">
                            <input inputmode="decimal" id="pizzaPoids" name="pizzaPoids" min="100" max="20000" step="1"
                            class="field digits large required" type="number" value="1000">
                        </div>
                    </div>
                    <div class="box">
                        <label for="pizzaFarine">Farine</label>
                        <div class="box">
                            <input id="pizzaFarine" name="pizzaFarine" readonly="readonly"
                            class="codepeoplecalculatedfield field large valid" type="text" value="45 gr">
                        </div>
                    </div>
                    <div class="box">
                        <label for="pizzaEau">Eau</label>
                        <div class="box">
                            <input id="pizzaEau" name="pizzaEau" readonly="readonly"
                            class="codepeoplecalculatedfield field large valid" type="text" value="6 gr">
                        </div>
                    </div>
                    <div class="box">
                        <label for="pizzaSel">Sel</label>
                        <div class="box">
                            <input id="pizzaSel" name="pizzaSel" readonly="readonly"
                            class="codepeoplecalculatedfield field large valid" type="text" value="2 gr">
                        </div>
                    </div>
                    <div class="box">
                        <label for="pizzaLevure">Levure fraîche de boulanger</label>
                        <div class="box">
                            <input id="pizzaLevure" name="pizzaLevure" readonly="readonly"
                            class="codepeoplecalculatedfield field large valid" type="text" value="1 gr">
                        </div>
                    </div>
                </fieldset>
                <fieldset style="overflow:auto;display:none">
                    <legend><h2 id="buns">Pâte à buns</h2></legend> <!-- Titre du fieldset -->
                    <div class="box">
                        <label for="bunsNb">Nombre de buns (de 100 grammes)</label>
                        <div class="box">
                            <input inputmode="decimal" id="bunsNb" name="bunsNb" min="1" max="500" step="1"
                            class="field digits large required" type="number" value="10">
                        </div>
                    </div>
                    <div class="box">
                        <label for="bunsPoids">Poids total</label>
                        <div class="box">
                            <input id="bunsPoids" name="bunsPoids" readonly="readonly"
                            class="codepeoplecalculatedfield field large valid" type="text" value="1000 gr">
                        </div>
                    </div>
                    <div class="box">
                        <label for="bunsFarine">Farine</label>
                        <div class="box">
                            <input id="bunsFarine" name="bunsFarine" readonly="readonly"
                            class="codepeoplecalculatedfield field large valid" type="text" value="523.56 gr">
                        </div>
                    </div>
                    <div class="box">
                        <label for="bunsEau">Eau</label>
                        <div class="box">
                            <input id="bunsEau" name="bunsEau" readonly="readonly"
                            class="codepeoplecalculatedfield field large valid" type="text" value="130.89 gr">
                        </div>
                    </div>
                    <div class="box">
                        <label for="bunsLait">Lait</label>
                        <div class="box">
                            <input id="bunsLait" name="bunsLait" readonly="readonly"
                            class="codepeoplecalculatedfield field large valid" type="text" value="130.89 gr">
                        </div>
                    </div>
                    <div class="box">
                        <label for="bunsHuile">Huile</label>
                        <div class="box">
                            <input id="bunsHuile" name="bunsHuile" readonly="readonly"
                            class="codepeoplecalculatedfield field large valid" type="text" value="10.47 gr">
                        </div>
                    </div>
                    <div class="box">
                        <label for="bunsSel">Sel</label>
                        <div class="box">
                            <input id="bunsSel" name="bunsSel" readonly="readonly"
                            class="codepeoplecalculatedfield field large valid" type="text" value="10.47 gr">
                        </div>
                    </div>
                    <div class="box">
                        <label for="bunsLevure">Levure fraîche de boulanger</label>
                        <div class="box">
                            <input id="bunsLevure" name="bunsLevure" readonly="readonly"
                            class="codepeoplecalculatedfield field large valid" type="text" value="10.47 gr">
                        </div>
                    </div>
                    <div class="box">
                        <label for="bunsSucre">Sucre</label>
                        <div class="box">
                            <input id="bunsSucre" name="bunsSucre" readonly="readonly"
                            class="codepeoplecalculatedfield field large valid" type="text" value="26.18 gr">
                        </div>
                    </div>
                    <div class="box">
                        <label for="bunsBeurre">Beurre</label>
                        <div class="box">
                            <input id="bunsBeurre" name="bunsBeurre" readonly="readonly"
                            class="codepeoplecalculatedfield field large valid" type="text" value="52.36 gr">
                        </div>
                    </div>
                    <div class="box">
                        <label for="bunsPuree">Purée de pomme de terres</label>
                        <div class="box">
                            <input id="bunsPuree" name="bunsPuree" readonly="readonly"
                            class="codepeoplecalculatedfield field large valid" type="text" value="104.71 gr">
                        </div>
                    </div>
                </fieldset>
            </form>
        </main>
        <footer>
        </footer>
    </body>
</html>
